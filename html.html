<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Complaint Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Online Complaint Management System</h1>
  <nav>
    <button class="tab active" data-view="userView">Submit and Track</button>
    <button class="tab" data-view="adminView">Admin</button>
  </nav>
</header>

<main>
  <!-- USER VIEW -->
  <section id="userView" class="view">
    <div class="grid">
      <form id="complaintForm" class="card">
        <h2>Submit a complaint</h2>
        <label for="name">Your name</label>
        <input id="name" required>
        <label for="email">Email</label>
        <input id="email" type="email" required>
        <label for="category">Category</label>
        <select id="category">
          <option>Service</option><option>Billing</option><option>Product</option>
          <option>Technical</option><option>Other</option>
        </select>
        <label for="priority">Priority</label>
        <select id="priority"><option>Low</option><option>Medium</option><option>High</option></select>
        <label for="description">Describe the problem</label>
        <textarea id="description" rows="4" required></textarea>
        <button type="submit" class="primary">Submit complaint</button>
        <p id="submitMsg" class="msg"></p>
      </form>

      <div class="card">
        <h2>Track your complaint</h2>
        <label for="trackId">Complaint ID</label>
        <input id="trackId" placeholder="Example: CMP-1001">
        <button id="trackBtn" class="primary">Track status</button>
        <div id="trackResult"></div>
      </div>
    </div>
  </section>

  <!-- ADMIN VIEW -->
  <section id="adminView" class="view" hidden>
    <div id="loginBox" class="card narrow">
      <h2>Admin login</h2>
      <label for="user">Username</label>
      <input id="user">
      <label for="pass">Password</label>
      <input id="pass" type="password">
      <button id="loginBtn" class="primary">Log in</button>
      <p id="loginMsg" class="msg"></p>
      <p class="hint">Demo login: admin / admin123</p>
    </div>

    <div id="adminPanel" hidden>
      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
        <div class="stat"><b id="sPending">0</b><span>Pending</span></div>
        <div class="stat"><b id="sProgress">0</b><span>In progress</span></div>
        <div class="stat"><b id="sResolved">0</b><span>Resolved</span></div>
      </div>
      <div class="tools">
        <input id="search" placeholder="Search by ID, name or description" aria-label="Search complaints">
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option><option>Pending</option>
          <option>In Progress</option><option>Resolved</option>
        </select>
        <button id="logoutBtn">Log out</button>
      </div>
      <div class="wrap">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Priority</th><th>Description</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>No complaints found.</div>
      </div>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
